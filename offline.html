<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AURAA — Offline</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#050f08;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:2rem;}
  .logo{font-family:'Syne',sans-serif;font-size:2.5rem;font-weight:800;color:#c9a84c;letter-spacing:.15em;margin-bottom:1rem;}
  .msg{font-size:1rem;color:#999;line-height:1.6;max-width:320px;}
  .retry{margin-top:1.5rem;padding:.6rem 1.5rem;background:#c9a84c;color:#050f08;border:none;border-radius:8px;font-weight:700;font-size:.9rem;cursor:pointer;}
</style>
</head>
<body>
  <div>
    <div class="logo">AURAA</div>
    <div class="msg">You're offline right now. Check your connection and try again.</div>
    <button class="retry" onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
